spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resource server:
        jwt:
          issuer-uri: https://accounts.google.com
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
app:
  jwt:
    secret: ${JWT_SECRET:reflectly-default-jwt-secret-key-change-in-production-min-32-chars}
    expiration-ms: 86400000
  google:
    client-id: ${GOOGLE_CLIENT_ID:YOUR_CLIENT_ID_HERE}
    client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_CLIENT_SECRET_HERE}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    # A Coach reply is a full model round-trip; the default read timeout has to outlast it.
    timeout-seconds: ${OPENROUTER_TIMEOUT_SECONDS:60}
    # Optional attribution headers for OpenRouter's app leaderboard.
    site-url: ${OPENROUTER_SITE_URL:}
    site-name: ${OPENROUTER_SITE_NAME:Reflectly}
  encryption:
    key: ${ENCRYPTION_KEY:}
  conversations:
    purge-after-extraction: ${PURGE_TRANSCRIPTS:false}
  auth:
    # Username/password login+signup — kept ON by default for local/dev testing.
    local-credentials-enabled: ${LOCAL_AUTH_ENABLED:true}
  quota:
    # Alpha-phase hard cap on Coach conversations per user, to bound OpenRouter API spend.
    # Raise via env var once ready for wider access — no code change needed.
    max-conversations-per-user: ${MAX_CONVERSATIONS_PER_USER:5}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
    conversation-requests-per-minute: ${CONVERSATION_RATE_LIMIT_PER_MINUTE:10}