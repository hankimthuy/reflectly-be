# =============================================================================
# Deploy Backend (Spring Boot) -> Azure Web App "ReflectlyBE"
# Chạy khi: push vào main, hoặc bấm tay (workflow_dispatch) trong tab Actions.
# =============================================================================
name: Build and deploy JAR app to Azure Web App - ReflectlyBE

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ReflectlyBE-sea
  JAVA_VERSION: '21'

jobs:
  # ---------------------------------------------------------------------------
  # JOB 0 — Kiểm tra secrets TRƯỚC KHI build.
  # Mục đích: nếu thiếu secret thì fail ngay ở đây với thông báo rõ ràng,
  # thay vì build 5 phút rồi app chết im lặng trên Azure và không biết vì sao.
  # ---------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra các GitHub Secrets bắt buộc
        env:
          # Đưa secret vào biến môi trường trước, KHÔNG nội suy thẳng vào lệnh shell.
          # Nếu nội suy thẳng, secret chứa dấu nháy/xuống dòng sẽ làm hỏng cú pháp script.
          S_AZ_CLIENT: ${{ secrets.AZUREAPPSERVICE_CLIENTID_159A59B6905D40EBB32147F5D6AEFC97 }}
          S_AZ_TENANT: ${{ secrets.AZUREAPPSERVICE_TENANTID_A0F837901B5B414DAA0765CD3F0F859A }}
          S_AZ_SUB:    ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2E5290F80FD94A1FA79E13B09B15E541 }}
          S_DB_URL:    ${{ secrets.DB_URL }}
          S_DB_USER:   ${{ secrets.DB_USERNAME }}
          S_DB_PASS:   ${{ secrets.DB_PASSWORD }}
          S_JWT:       ${{ secrets.JWT_SECRET }}
          S_G_ID:      ${{ secrets.GOOGLE_CLIENT_ID }}
          S_G_SECRET:  ${{ secrets.GOOGLE_CLIENT_SECRET }}
          S_GEMINI:    ${{ secrets.GEMINI_API_KEY }}
          S_ENC:       ${{ secrets.ENCRYPTION_KEY }}
          S_CORS:      ${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
        run: |
          MISSING=""

          # Dùng if/fi thay cho "test && gán".
          # Lý do: GitHub Actions chạy bash với -e; một dòng "test ... && ..."
          # khi test SAI sẽ trả mã 1 và làm cả step thoát ngay lập tức.
          need() {
            if [ -z "$2" ]; then
              MISSING="${MISSING}
            - $1"
            fi
          }

          need "AZUREAPPSERVICE_CLIENTID_..."       "$S_AZ_CLIENT"
          need "AZUREAPPSERVICE_TENANTID_..."       "$S_AZ_TENANT"
          need "AZUREAPPSERVICE_SUBSCRIPTIONID_..." "$S_AZ_SUB"
          need "DB_URL"                             "$S_DB_URL"
          need "DB_USERNAME"                        "$S_DB_USER"
          need "DB_PASSWORD"                        "$S_DB_PASS"
          need "JWT_SECRET"                         "$S_JWT"
          need "GOOGLE_CLIENT_ID"                   "$S_G_ID"
          need "GOOGLE_CLIENT_SECRET"               "$S_G_SECRET"
          need "GEMINI_API_KEY"                     "$S_GEMINI"
          need "ENCRYPTION_KEY"                     "$S_ENC"
          need "APP_CORS_ALLOWED_ORIGINS"           "$S_CORS"

          if [ -n "$MISSING" ]; then
            echo "Thiếu các GitHub Secrets sau:"
            echo "$MISSING"
            echo "Khai báo tại: repo -> Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "::error::Thiếu GitHub Secrets bắt buộc — xem danh sách ở log phía trên."
            exit 1
          fi
          echo "Đủ secrets, tiếp tục build."

  # ---------------------------------------------------------------------------
  # JOB 1 — Build file .jar
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Cài Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'microsoft'
          cache: maven

      # `package` thay cho `install`: không cần đẩy vào local repo, nhanh hơn.
      # `-DskipTests`: test đã chạy riêng ở ci.yml trên pull request rồi.
      - name: Build với Maven
        run: mvn -B clean package -DskipTests

      # Spring Boot tạo 2 file trong target/: bản fat jar (chạy được) và
      # bản *.jar.original (không chạy được). Chỉ lấy đúng fat jar.
      - name: Gom đúng 1 file jar để deploy
        run: |
          mkdir -p staging
          cp target/*.jar staging/app.jar
          ls -lh staging/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: staging/app.jar

  # ---------------------------------------------------------------------------
  # JOB 2 — Nạp cấu hình vào Azure rồi deploy
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Tải artifact từ job build
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Đăng nhập Azure
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZUREAPPSERVICE_CLIENTID_159A59B6905D40EBB32147F5D6AEFC97 }}
          tenant-id:       ${{ secrets.AZUREAPPSERVICE_TENANTID_A0F837901B5B414DAA0765CD3F0F859A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2E5290F80FD94A1FA79E13B09B15E541 }}

      # App Settings = "biến môi trường" của Web App trên Azure.
      # Code đọc chúng qua ${DB_URL}, ${JWT_SECRET}... trong application.yml.
      - name: Nạp App Settings cho Azure Web App
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          app-settings-json: |
            [
              { "name": "DB_URL",                   "value": "${{ secrets.DB_URL }}",               "slotSetting": false },
              { "name": "DB_USERNAME",              "value": "${{ secrets.DB_USERNAME }}",          "slotSetting": false },
              { "name": "DB_PASSWORD",              "value": "${{ secrets.DB_PASSWORD }}",          "slotSetting": false },
              { "name": "JWT_SECRET",               "value": "${{ secrets.JWT_SECRET }}",           "slotSetting": false },
              { "name": "GOOGLE_CLIENT_ID",         "value": "${{ secrets.GOOGLE_CLIENT_ID }}",     "slotSetting": false },
              { "name": "GOOGLE_CLIENT_SECRET",     "value": "${{ secrets.GOOGLE_CLIENT_SECRET }}", "slotSetting": false },
              { "name": "GEMINI_API_KEY",           "value": "${{ secrets.GEMINI_API_KEY }}",       "slotSetting": false },
              { "name": "ENCRYPTION_KEY",           "value": "${{ secrets.ENCRYPTION_KEY }}",       "slotSetting": false },
              { "name": "APP_CORS_ALLOWED_ORIGINS", "value": "${{ secrets.APP_CORS_ALLOWED_ORIGINS }}", "slotSetting": false },
              { "name": "SPRING_PROFILES_ACTIVE",   "value": "prod",  "slotSetting": false }
            ]
          # Cố ý KHÔNG đặt WEBSITES_PORT. application-prod.yml đã dùng
          # server.port: ${PORT:8080} — Azure Java SE tự truyền PORT vào.
          # Đặt thêm WEBSITES_PORT lệch giá trị sẽ làm Azure route sai cổng.

      - name: Deploy lên Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: 'app.jar'

      # Health check KHÔNG dùng continue-on-error nữa.
      # Trước đây lỗi bị nuốt -> workflow xanh nhưng app chết. Giờ nó phải đỏ.
      - name: Health check (app có thật sự sống không)
        env:
          HEALTH_URL: ${{ secrets.BE_HEALTH_URL }}
        run: |
          URL="${HEALTH_URL:-https://reflectlybe-sea-bkaygkhzgzd7akfd.southeastasia-01.azurewebsites.net}"
          echo "Đang gọi $URL/actuator/health ..."
          for i in $(seq 1 20); do
            if curl -sf "$URL/actuator/health"; then
              echo ""
              echo "Backend sống. Deploy thành công."
              exit 0
            fi
            echo "Chờ app khởi động... ($i/20)"
            sleep 15
          done
          echo "::error::Backend KHÔNG lên sau 5 phút. Đây gần như luôn là lỗi kết nối DB hoặc schema."
          echo "::error::Cách xem log thật: Azure Portal -> App Service ReflectlyBE-sea -> Log stream. Tìm dòng 'Schema-validation' hoặc 'Connection refused'."
          exit 1
