version: '3.8'

# This file defines the services for your application.
services:
  postgres:
    # pgvector-enabled image (needed for future semantic memory search on
    # Insight/RelationshipEvent embeddings). Same Postgres major version (16)
    # family as before, just with the `vector` extension available.
    image: pgvector/pgvector:pg16

    # Give the container a custom name for easy identification.
    container_name: reflectly-postgres

    # Host 5433 — avoids clash with other local stacks on 5432 (e.g. web-cms).
    ports:
      - "5433:5432"

    # Set environment variables for the PostgreSQL database.
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: reflectly

    # Use a named volume to persist the database data. This prevents data loss
    # when the container is stopped or removed.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once on first init of an empty data volume — creates the vector extension.
      - ./db/init:/docker-entrypoint-initdb.d

# Define the named volumes used by the services.
volumes:
  postgres_data: